<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VOZ Chụp Mũ">
  <title>VOZ Chụp Mũ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- the nón lá, coming down at an angle: "chụp mũ" -->
  <g transform="rotate(-9 64 58)">
    <path d="M64 12L118 56q-54 14-108 0z" fill="#eccb96"/>
    <path d="M64 12v44" stroke="#d9b478" stroke-width="2" opacity="0.75"/>
    <path d="M10 56q54 14 108 0" stroke="#b8863b" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <circle cx="64" cy="84" r="34" fill="#fde68a"/>
  <circle cx="44" cy="92" r="6.5" fill="#fb7185" opacity="0.55"/>
  <circle cx="84" cy="92" r="6.5" fill="#fb7185" opacity="0.55"/>

  <!-- eyes -->
  <circle cx="52" cy="79" r="6" fill="#1f2937"/>
  <path d="M70 81q7-9 15 0" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- grin -->
  <path d="M50 96q14 14 28-2" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
